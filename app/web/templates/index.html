<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>limit-usage · AI 額度儀表板</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <header class="top">
    <div>
      <h1>limit-usage</h1>
      <p class="sub">Codex · SuperGrok · DeepSeek · 本月刷卡 · port {{ port }} · v{{ version }}</p>
    </div>
    <div class="actions">
      <button id="refresh-btn" type="button">立即刷新</button>
      <div class="meta">
        <div>伺服器時間：<span id="server-time">—</span></div>
        <div>下次輪詢：<span id="next-poll">—</span></div>
        <div id="refresh-msg" class="msg"></div>
      </div>
    </div>
  </header>

  <main id="cards" class="cards">
    <p class="loading">載入中…</p>
  </main>

  <section class="trends-section">
    <div class="trends-head">
      <h2>7 日趨勢與剩餘工作量估算</h2>
      <p class="hint">依歷史輪詢資料計算消耗速率（非官方任務計數）。樣本少時估算會不準。</p>
    </div>
    <div id="trends" class="trends">
      <p class="loading">載入趨勢…</p>
    </div>
  </section>

  <footer>
    <p>
      紅字粗體：僅 Weekly 額度偏低／將重置，或 DeepSeek CNY &lt; 10。5h 不提醒；DeepSeek 只顯示 CNY。
    </p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
