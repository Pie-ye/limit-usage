    pool: agy
    slots: ["5h", "1w"]
    bench: 81
    bench_note: "SWE-Pro 61.6；TB 2.1 90.8（全場最高）；聚合榜勝 3.1 Pro"
    price: {input: 0.75, output: 3.75, as_of: "2026-09-26", source: "https://ai.google.dev/gemini-api/docs/pricing"}
