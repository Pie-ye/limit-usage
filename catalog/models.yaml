# Model catalog — the single source of truth for which models exist, how strong
# they are (bench) and what they cost (API list price). Tiers are NOT stored here:
# catalog/tiering.py derives each model's [min_tier, max_tier] from bench and price
# using catalog/tiering.yaml. Update bench / price here; never hand-set a tier.
schema_version: 2
catalog_version: "2026-09-26.1"
pools:
  claude:
    provider: claude
    display_name: "Claude Code (claude)"
    slots: {"5h": "5h", "1w": "1w", "1w-fable": "1w-fable"}
  codex:
    provider: codex
    display_name: "Codex (codex)"
    slots: {"5h": "5h", "1w": "1w"}
  grok:
    provider: supergrok
    display_name: "SuperGrok (grok)"
    slots: {"1w": "weekly"}
  agy:
    provider: antigravity
    display_name: "Antigravity · Gemini (agy)"
    slots: {"5h": "5h", "1w": "1w"}
  agy-3p:
    provider: antigravity
    display_name: "Antigravity · Claude/GPT (agy)"
    slots: {"5h": "3p-5h", "1w": "3p-1w"}
models:
  # --- agy (Antigravity, gemini-* only) ---
  gemini-3.8-flash-low:
    pool: agy
    slots: ["5h", "1w"]
    bench: 55
    bench_note: "最低推理檔"
    price: {input: 0.75, output: 3.75, as_of: "2026-09-26", source: "https://ai.google.dev/gemini-api/docs/pricing"}
