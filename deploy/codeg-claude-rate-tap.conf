# systemd drop-in for codeg.service: spawn Claude through the rate-limit tap so
# the limit-usage Claude card gets official 5h/7d/Fable windows in real time.
# Install:  install -Dm644 deploy/codeg-claude-rate-tap.conf \
#             ~/.config/systemd/user/codeg.service.d/claude-rate-tap.conf
#           systemctl --user daemon-reload && systemctl --user restart codeg
# Restarting codeg ends every open codeg session. Remove the file and repeat the
# two commands to roll back.
[Service]
Environment="CLAUDE_CODE_EXECUTABLE=%h/Container/limit-usage/deploy/claude-rate-tap"
