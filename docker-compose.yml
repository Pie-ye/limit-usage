# Production runtime for limit-usage (replaces user systemd unit).
# Host widgets / homepage-edge keep talking to 127.0.0.1:50048.
# Secrets: Infisical folder /limit-usage (DEEPSEEK_API_KEY).
# Start: /home/pieye/Container/scripts/with-infisical limit-usage -- docker compose up -d
services:
  limit-usage:
    build: .
    image: limit-usage:local
    container_name: limit-usage
    ports:
      - "127.0.0.1:50048:50048"
      # Tailnet address of this host (pipc). Other hosts on the tailnet —
      # oracle-edge, the Windows box — reach /api/routing here, so dispatch on
      # every machine shares one FeedbackRegistry and one usage.db. Bound to the
      # tailnet IP rather than 0.0.0.0 because published Docker ports bypass ufw:
      # 0.0.0.0 would put the unauthenticated write endpoints on every interface.
      # Note: docker.service is not ordered after tailscaled.service, so on a cold
      # boot this bind can lose the race and fail with "cannot assign requested
      # address"; restart: unless-stopped retries until tailscale0 has the IP.
      - "100.64.128.70:50048:50048"
    environment:
      HOST: "0.0.0.0"
      PORT: "50048"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-60}"
      DATABASE_PATH: "/app/data/usage.db"
      CODEX_AUTH_PATH: "/secrets/codex/auth.json"
      GROK_AUTH_PATH: "/secrets/grok/auth.json"
      ANTIGRAVITY_TOKEN_PATH: "/secrets/antigravity/acp_token.json"
      CLAUDE_CREDENTIALS_PATH: "/secrets/claude/.credentials.json"
      CLAUDE_STATUSLINE_CAPTURE_PATH: "/secrets/claude-monitor/statusline/latest.json"
      CLAUDE_USAGE_CACHE_PATH: "/secrets/claude-monitor/state/claude-code-usage.json"
      # Written by deploy/claude-rate-tap from headless (codeg) sessions.
      CLAUDE_STREAM_CAPTURE_PATH: "/secrets/claude-monitor/stream/latest.json"
      # Already inside the ~/.claude mount below. Only the newest mtime is read
      # (never the contents) to decide whether anyone is spending quota right
      # now, which paces the OAuth fallback.
      CLAUDE_PROJECTS_DIR: "/secrets/claude/projects"
    volumes:
      - ./data:/app/data
      # Codex is read-only; Grok is writable so rotated OIDC tokens persist.
      - ${HOME}/.codex/auth.json:/secrets/codex/auth.json:ro
      - ${HOME}/.grok/auth.json:/secrets/grok/auth.json:rw
      # Host UPower daemon (UPS widget)
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      # Google Antigravity OAuth token (from scripts/antigravity_login.py)
      - ${HOME}/.gemini/antigravity-acp:/secrets/antigravity:ro
      # Claude Code credentials (from claude login / ~/.claude/.credentials.json).
      # Mount the PARENT of ~/.claude, not the file: Claude Code rotates the
      # OAuth token by writing a new file and renaming it over the old one, and
      # a single-file bind mount stays pinned to the original inode. The
      # container would keep serving the pre-rotation token until it is revoked,
      # then 401 forever. The rename happens inside ~/.claude, so mounting that
      # directory is enough to let it through.
      - ${HOME}/.claude:/secrets/claude:ro
      # ~/.claude-monitor holds two files, both written by rename (so the
      # directory, not either file, must be the mount): statusline/latest.json
      # (written by the `claude-monitor --statusline` hook) and
      # state/claude-code-usage.json (written by the
      # limit-usage-claude-monitor.timer user unit).
      - ${HOME}/.claude-monitor:/secrets/claude-monitor:ro
      # n8n monthly card-spend cache (Homepage / dashboard card)
      - ${HOME}/Container/n8n/data/homepage-card-spend.json:/secrets/card-spend/homepage-card-spend.json:ro
      - ${HOME}/Container/n8n/data/homepage-concerts.json:/secrets/concerts/homepage-concerts.json:ro
      # Three-host health state & rsync backup snapshots
      - ${HOME}/.local/state/three-host:/secrets/three-host:ro
      - ${HOME}/backup/rsync-backups:/secrets/rsync-backups:ro
      - ${HOME}/Container/scripts/three_host/deployment-status.json:/secrets/three-host-deployment-status.json:ro
    # Host AppArmor otherwise blocks container → system upowerd over D-Bus.
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:50048/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  routing-policy:
    build:
      context: .
      dockerfile: routing-policy/Dockerfile
    image: routing-policy:local
    container_name: routing-policy
    ports:
      # 只有 localhost。對外由 cloudflared 主動建立 outbound tunnel 接進來，
      # origin 不需要 public IP，也不對 Internet 開 inbound port。
      # 絕不加 tailnet IP 或 0.0.0.0：published docker port 會繞過 ufw。
      - "127.0.0.1:50100:50100"
    environment:
      HOST: "0.0.0.0"
      PORT: "50100"
      LIMIT_USAGE_ROUTING_URL: "http://limit-usage:50048/api/routing"
    depends_on:
      - limit-usage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:50100/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
